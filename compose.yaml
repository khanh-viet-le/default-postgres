services:
  postgres:
    # PostgreSQL 16 + pgvector 0.8.7, Debian Bookworm
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    container_name: rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Bind to localhost only; do not expose PostgreSQL publicly by default.
    ports:
      - "${POSTGRES_PORT}:5432"

    # PostgreSQL 16 stores its data under /var/lib/postgresql/data.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro

    # Required by pg_stat_statements.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - timezone=UTC

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
